# Le site a déménagé sur Cloudflare Pages (https://dockfall.pages.dev) : tout ce qui arrive ici y est renvoyé,
# y compris version.json (les anciennes versions du jeu trouvent ainsi la mise à jour).
[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "https://dockfall.pages.dev/:splat"
  status = 301
  force = true
