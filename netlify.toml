# Site statique (aucune construction) et fonctions du classement.
[build]
  publish = "."
  functions = "netlify/functions"

# version.json est lu par le jeu au démarrage : jamais de cache, pour voir tout de suite une nouvelle version
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
    Access-Control-Allow-Origin = "*"
